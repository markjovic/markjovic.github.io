<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mark Jovic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --oval:#14432f; --turf:#1f6b47; --chalk:#f4f6f1; --paper:#ffffff; --ink:#172019; --muted:#5d6b62; --line:#d9e0da; --gold:#e3b23c;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --chalk:#0f1a14; --paper:#15231b; --ink:#e7ede8; --muted:#9fb1a5; --line:#29392f; --oval:#0c2b1e; --turf:#2c8a5d; }
}
:root[data-theme="dark"]{ --chalk:#0f1a14; --paper:#15231b; --ink:#e7ede8; --muted:#9fb1a5; --line:#29392f; --oval:#0c2b1e; --turf:#2c8a5d; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--chalk); color:var(--ink); font:16px/1.5 var(--body); }
header{ background:var(--oval); color:#f4f6f1; padding:28px 20px 22px; }
.wrap{ max-width:820px; margin:0 auto; }
h1{ font:700 clamp(2.2rem,7vw,3.6rem)/0.95 var(--cond); margin:0; }
header p{ margin:8px 0 0; color:#cfe0d5; max-width:60ch; }
main{ padding:20px 20px 40px; }
#status{ font-size:.9rem; color:var(--muted); margin:0 0 14px; } #status.warn{ color:#9a6a00; }
ul{ list-style:none; margin:0; padding:0; display:grid; gap:10px; }
li{ background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:14px 16px; display:grid; grid-template-columns:1fr auto; gap:4px 16px; align-items:center; }
li h2{ font:700 1.4rem/1.05 var(--cond); margin:0; }
li h2 a{ color:inherit; text-decoration:none; }
li h2 a:hover{ text-decoration:underline; }
li p{ margin:0; font-size:.92rem; color:var(--muted); grid-column:1; }
.go{ grid-row:1 / span 2; grid-column:2; font:700 1rem var(--cond); background:var(--turf); color:#fff; border-radius:6px; padding:9px 14px; text-decoration:none; white-space:nowrap; }
.meta{ font-size:.8rem; }
.meta a{ color:var(--muted); }
a:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
@media (max-width:520px){ li{ grid-template-columns:1fr; } .go{ grid-row:auto; grid-column:1; justify-self:start; margin-top:6px; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Mark Jovic</h1>
    <p>Everything I&rsquo;ve published on GitHub, in one place. New sites appear here automatically.</p>
  </div>
</header>
<main class="wrap">
  <p id="status" role="status">Loading sites&hellip;</p>
  <ul id="sites"></ul>
</main>
<script>
(() => {
  const USER = 'markjovic';
  // Any repository with this topic (set under the repo's About > Topics) is left off this page.
  const HIDE_TOPIC = 'unlisted';
  // Repositories to leave off this page by name, as an alternative to the topic.
  const HIDE = [];
  // Friendlier titles. Descriptions come from each repository's About description;
  // the text here is only used when that description is empty.
  const LABELS = {
    '23-0-ratings':     ['23-0 ratings', 'Exact ratings for every player in the 23-0 AFL game, plus the in-game overlay bookmarklet.'],
    'gridley-analysis': ['Gridley grid analysis', 'Every valid answer and pick rate for each daily Gridley grid, archived nightly.'],
    'worpel-analysis':  ['Worpel history', 'Every past Worpel and Worpel Legends mystery player, recorded daily.'],
  };
  // Used only if GitHub's list of repositories can't be loaded.
  const FALLBACK = Object.keys(LABELS).map(name => ({ name, description: '', pushed_at: null, html_url: `https://github.com/${USER}/${name}` }));

  const st = document.getElementById('status');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const siteUrl = name => name.toLowerCase() === `${USER}.github.io` ? `https://${USER}.github.io/` : `https://${USER}.github.io/${name}/`;
  const pretty = name => name.replace(/[-_]+/g, ' ').replace(/^\w/, c => c.toUpperCase());

  function render(repos) {
    document.getElementById('sites').innerHTML = repos.map(r => {
      const [label, fallback] = LABELS[r.name] ?? [pretty(r.name), ''];
      const title = label, blurb = r.description || fallback;
      const updated = r.pushed_at ? `Updated ${new Date(r.pushed_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}. ` : '';
      return `<li><h2><a href="${siteUrl(r.name)}">${esc(title)}</a></h2><a class="go" href="${siteUrl(r.name)}">Open</a>
        <p>${esc(blurb)}</p><p class="meta">${updated}<a href="${esc(r.html_url)}">Source</a></p></li>`;
    }).join('');
  }

  (async () => {
    try {
      const r = await fetch(`https://api.github.com/users/${USER}/repos?per_page=100&sort=pushed`, { headers: { Accept: 'application/vnd.github+json' } });
      if (!r.ok) throw new Error(`GitHub returned HTTP ${r.status}${r.status === 403 ? ' (hourly request limit reached)' : ''}`);
      const all = await r.json();
      const sites = all.filter(x => x.has_pages && !x.fork && !x.archived && !HIDE.includes(x.name) && !(x.topics || []).includes(HIDE_TOPIC) && x.name.toLowerCase() !== `${USER}.github.io`);
      if (!sites.length) throw new Error('no repositories with a published site were found');
      render(sites);
      st.textContent = `${sites.length} published ${sites.length === 1 ? 'site' : 'sites'}, newest changes first.`;
    } catch (e) {
      render(FALLBACK);
      st.className = 'warn';
      st.textContent = `The live list from GitHub couldn't be loaded (${e.message}), so this is the saved list.`;
    }
  })();
})();
</script>
</body>
</html>
